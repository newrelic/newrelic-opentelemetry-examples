plugins {
    id 'java'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.amazonaws:aws-lambda-java-core:1.2.1'
    implementation 'com.amazonaws:aws-lambda-java-events:3.6.0'
    implementation 'ch.qos.logback:logback-classic:1.2.3'
    implementation 'io.opentelemetry:opentelemetry-api:1.32.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

test {
    useJUnitPlatform()
}

// SAM packaged the function in the original examples; Terraform needs a
// deployable zip instead. Lambda's Java runtime expects classes at the zip
// root and dependency jars under lib/.
tasks.register('buildZip', Zip) {
    archiveFileName = 'function.zip'
    from compileJava
    from processResources
    into('lib') {
        from configurations.runtimeClasspath
    }
}
