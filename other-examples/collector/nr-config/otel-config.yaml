extensions:
  health_check: {}
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: otel-collector:4317
      http:
        endpoint: otel-collector:4318
  fluentforward:
    endpoint: 0.0.0.0:8006
processors:
  # Will convert all monotonic, cumulative sums to monotonic, delta sums
  cumulativetodelta:
  transform:
    trace_statements:
      - truncate_all(span.attributes, 4095)
      - truncate_all(resource.attributes, 4095)
    log_statements:
      - truncate_all(log.attributes, 4095)
      - truncate_all(resource.attributes, 4095)
    metric_statements:
      - truncate_all(datapoint.attributes, 4095)
      - truncate_all(resource.attributes, 4095)
exporters:
  debug:
    verbosity: ${LOG_EXPORTER_LOG_VERBOSITY}
  otlp_http:
    endpoint: https://otlp.nr-data.net
    headers:
      api-key: ${NEW_RELIC_API_KEY}
    sending_queue:
      batch:
        enabled: true
service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [cumulativetodelta, transform]
      exporters: [debug, otlp_http]
    traces:
      receivers: [otlp]
      processors: [transform]
      exporters: [debug, otlp_http]
    logs:
      receivers: [otlp, fluentforward]
      processors: [transform]
      exporters: [debug, otlp_http]
