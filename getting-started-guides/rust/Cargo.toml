[package]
name = "fibonacci"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.12.0"
opentelemetry-instrumentation-actix-web = { version = "0.25.0", features = ["metrics"] }
opentelemetry = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["grpc-tonic", "trace", "metrics", "logs", "tls-roots", "tls-ring", "gzip-tonic"] }
opentelemetry_sdk = "0.33.1"
serde = { version = "1.0.205", features = ["derive"] }
tonic = "0.14.1"
opentelemetry-appender-tracing = "0.33.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "registry", "std", "fmt"] }
